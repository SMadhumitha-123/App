name: build
on:
  workflow_dispatch:
  push:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --project-name ledger_app --platforms=android .
      - run: sed -i 's/android:label="[^"]*"/android:label="Mr.Kanakku Pillai"/' android/app/src/main/AndroidManifest.xml
      - run: sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f icons_android.yaml
      - name: Use the fixed signing key (so this APK can update the app already installed)
        env:
          KEY_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            mkdir -p ~/.android
            echo "$KEY_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using the fixed signing key"
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret yet: this APK gets a random key and cannot update an installed app"
          fi
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: build/app/outputs/flutter-apk/app-release.apk }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --project-name ledger_app --platforms=windows .
      - run: sed -i 's/L"ledger_app"/L"Mr.Kanakku Pillai"/' windows/runner/main.cpp
        shell: bash
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f icons_windows.yaml
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with: { name: windows-app, path: build/windows/x64/runner/Release }
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --project-name ledger_app --platforms=linux .
      - run: sed -i 's/"ledger_app"/"Mr.Kanakku Pillai"/' linux/runner/my_application.cc
      - run: flutter pub get
      - run: find "${PUB_CACHE:-$HOME/.pub-cache}" -path '*flutter_secure_storage_linux*' -name json.hpp -exec sed -i 's/operator "" _/operator ""_/g' {} +
      - run: flutter build linux --release
        env:
          CXXFLAGS: -Wno-deprecated-literal-operator
      - uses: actions/upload-artifact@v4
        with: { name: linux-app, path: build/linux/x64/release/bundle }
